<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }

            .card h1 {
                font-size: 32px;
                margin-bottom: 20px;
                color: #e74c3c;
            }

            .card p {
                font-size: 16px;
                line-height: 1.6;
                margin-bottom: 10px;
            }

        .contact {
            margin-top: 20px;
            font-weight: 500;
        }

        a {
            color: #0077cc;
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

            .btn:hover {
                background-color: #005fa3;
            }

        .logo {
            margin-bottom: 20px;
        }

            .logo img {
                max-height: 60px;
            }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #888;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

                .card h1 {
                    font-size: 26px;
                }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="https://www.villaallende.gov.ar/logo.png" alt="Logo Municipalidad">
            </div>
            <h1>Acceso Denegado</h1>
            <p>Usted no tiene permisos para acceder a esta sección del sistema.</p>
            <p class="contact">
                Si cree que se trata de un error, por favor comuníquese con el Departamento de Sistemas:<br>
                Interno <strong>133</strong> o <a href="mailto:sistemas@villaallende.gov.ar">sistemas@villaallende.gov.ar</a>
            </p>
            <a href="javascript:history.back()" class="btn">⬅ Volver atrás</a>
        </div>
        <footer>
            © Municipalidad de Villa Allende — Todos los derechos reservados
        </footer>
    </div>

</body>
</html>
